name: controller

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      trigger:
        description: 'What triggered this run (manual | worker-done | grid-hit)'
        required: false
        default: 'manual'
      max_workers:
        description: 'Maximum simultaneously dispatched workers (hard cap 20)'
        required: false
        default: '20'

permissions:
  contents: write
  actions: write

concurrency:
  group: controller
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout scan code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Skip if a controller cycle just completed (< 4 min ago)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST=$(gh run list --workflow=controller.yml --status=completed \
                 --limit 1 --json updatedAt --jq '.[0].updatedAt')
          echo "last completed controller at: $LAST"
          if [ -n "$LAST" ]; then
            NOW=$(date -u +%s)
            LASTTS=$(date -u -d "$LAST" +%s)
            AGE=$(( NOW - LASTTS ))
            echo "age seconds: $AGE"
            if [ "$AGE" -lt 240 ]; then
              echo "a controller cycle just ran; exiting to avoid duplicate work"
              exit 0
            fi
          fi

      - name: Reconcile shards, govern budget, cascade on hits, dispatch grid
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_ACTIVE_WORKERS: ${{ github.event.inputs.max_workers || '20' }}
          WORKER_MINUTES: '300'
        run: python scan/grid_controller.py
