name: controller

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      trigger:
        description: 'What triggered this run (manual | worker-done)'
        required: false
        default: 'manual'
      max_workers:
        description: 'Maximum simultaneously dispatched workers (hard cap 100)'
        required: false
        default: '100'

permissions:
  contents: write
  actions: write

concurrency:
  group: controller
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout scan code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Skip if a controller cycle is already active or just ran
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST=$(gh run list --workflow=controller.yml --limit 1 \
                 --json createdAt,updatedAt,status,conclusion)
          echo "latest controller run: $LAST"
          CREATED=$(echo "$LAST" | jq -r '.[0].createdAt // empty')
          if [ -n "$CREATED" ]; then
            NOW=$(date -u +%s)
            CREATEDTS=$(date -u -d "$CREATED" +%s)
            AGE=$(( NOW - CREATEDTS ))
            echo "age since latest run creation: $AGE s"
            if [ "$AGE" -lt 150 ]; then
              echo "a controller run was created < 150s ago (active or just finished);"
              echo "skipping to avoid dispatch storm / duplicate work"
              exit 0
            fi
          fi

      - name: Reconcile queue, dispatch workers, tune global rate, monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_ACTIVE_WORKERS: ${{ github.event.inputs.max_workers || '100' }}
          MAX_DISPATCH_PER_CYCLE: '60'
        run: python scan/controller.py
